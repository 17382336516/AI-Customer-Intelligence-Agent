[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-intelligence-agent"
version = "1.2.0"
description = "Workflow-based 3+1 multi-agent customer intelligence system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "scikit-learn>=1.6,<2",
  "langgraph>=0.6,<2",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "jieba>=0.42,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
